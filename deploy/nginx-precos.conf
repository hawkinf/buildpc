# Site dedicado (não um location dentro de contaslite.hawk.com.br, ao
# contrário da API): precos.hawk.com.br tem certificado próprio, emitido via
# `certbot --nginx -d precos.hawk.com.br` DEPOIS deste arquivo instalado em
# /etc/nginx/sites-available/ e linkado em sites-enabled/. O certbot edita
# este mesmo bloco (adiciona ssl_certificate/ssl_certificate_key e o redirect
# 80→443, no mesmo formato usado por hdd.hawk.com.br e as demais
# *.hawk.com.br nesta VPS) — não crie o bloco HTTPS manualmente antes de
# rodar o certbot. DNS já é proxied pelo Cloudflare (confirmado: mesmo
# esquema dos outros subdomínios hawk.com.br, o desafio HTTP-01 passa
# normalmente pelo proxy).
#
# Blazor Server mantém a UI viva por um circuito SignalR sobre WebSocket: sem
# os cabeçalhos Upgrade/Connection abaixo, a reconexão nunca fecha e a tela
# fica presa no modal "Reconectando..." (fase 4). O mapa $connection_upgrade
# precisa estar no bloco http{} — vai em
# /etc/nginx/conf.d/02-websocket-map.conf (mesma convenção de
# 00-security-hardening.conf/01-cloudflare-realip.conf já usada nesta VPS),
# não duplicado aqui.

server {
    listen 80;
    listen [::]:80;
    server_name precos.hawk.com.br;

    include snippets/hawk-security.conf;

    location / {
        proxy_pass http://127.0.0.1:8126;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_connect_timeout 10s;
        # Um circuito Blazor Server fica pendurado nessa conexão enquanto a
        # aba estiver aberta — bem acima do read_timeout de uma API comum.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }

    access_log /var/log/nginx/precos.access.log;
    error_log  /var/log/nginx/precos.error.log;
}
