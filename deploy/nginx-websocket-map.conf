# Instalar em /etc/nginx/conf.d/02-websocket-map.conf (mesma convenção de
# 00-security-hardening.conf/01-cloudflare-realip.conf, já usados nesta
# VPS). Só precisa existir uma vez no servidor inteiro — o mapa é usado por
# qualquer site que fizer proxy_pass para um app que aceite WebSocket
# (hoje: precos.hawk.com.br/BuildPc.Web). Sem ele, uma conexão HTTP normal
# (sem cabeçalho Upgrade) receberia "Connection: upgrade" também, o que
# alguns clientes/proxies tratam como resposta malformada.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
