# Site dedicado (não um location dentro de contaslite.hawk.com.br, ao
# contrário da API): precos.hawk.com.br tem certificado próprio, emitido via
# `certbot --nginx -d precos.hawk.com.br` DEPOIS deste arquivo instalado em
# /etc/nginx/sites-available/ e linkado em sites-enabled/. O certbot edita
# este mesmo bloco (adiciona ssl_certificate/ssl_certificate_key e o redirect
# 80→443) — não crie o bloco HTTPS manualmente antes de rodar o certbot.
#
# Blazor Server mantém a UI viva por um circuito SignalR sobre WebSocket: sem
# os cabeçalhos Upgrade/Connection abaixo, a reconexão nunca fecha e a tela
# fica presa no modal "Reconectando..." (fase 4). O mapa $connection_upgrade
# só pode ficar no bloco http{} do nginx.conf principal — se outro serviço
# desta VPS já usa WebSocket atrás do Nginx (havia um serviço de chat
# mencionado no plano original), o mapa provavelmente já existe; não
# duplique a diretiva "map", só confira com
# `grep -r connection_upgrade /etc/nginx/nginx.conf /etc/nginx/conf.d/`.
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    listen [::]:80;
    server_name precos.hawk.com.br;

    location / {
        proxy_pass http://127.0.0.1:8126;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_connect_timeout 10s;
        # Um circuito Blazor Server fica pendurado nessa conexão enquanto a
        # aba estiver aberta — bem acima do read_timeout de uma API comum.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}
